openapi: 3.0.3
info:
  title: PDA Backend API
  version: 0.3.0
  description: PDA public transport envelope, headers, metadata, identity, device, warehouse, and workflow contract.
servers:
  - url: /api/pda/v1
paths:
  /healthz:
    get:
      responses:
        '200': {description: Healthy}
  /livez:
    get:
      responses:
        '200': {description: Live}
  /readyz:
    get:
      responses:
        '200': {description: Ready}
  /auth/login:
    post:
      operationId: login
      description: Authenticates an operator. Local mock auth is available only outside production; OIDC remains a separate adapter contract.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200': {description: Authenticated}
        '401': {description: Invalid credentials}
        '429': {description: Rate limited}
  /commands/{commandId}:
    get:
      operationId: commandStatus
      security: [{bearerAuth: []}]
      parameters: [{name: commandId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'200': {description: Canonical durable command status}, '403': {description: Command access denied}, '404': {description: Command not found}}
  /auth/refresh:
    post:
      operationId: refreshSession
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RefreshRequest'}
      responses:
        '200': {description: Token rotated}
        '401': {description: Unauthorized}
        '429': {description: Rate limited}
  /auth/logout:
    post:
      operationId: logout
      security: [{bearerAuth: []}]
      responses:
        '204': {description: Token revoked}
        '401': {description: Unauthorized}
  /me:
    get:
      operationId: currentOperator
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Current trusted operator}
        '401': {description: Unauthorized}
  /me/warehouses:
    get:
      operationId: operatorWarehouses
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Allowed warehouses}
        '401': {description: Unauthorized}
  /devices/registrations:
    post:
      operationId: registerDevice
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DeviceRegistrationRequest'}
      responses:
        '201': {description: Registered}
        '401': {description: Unauthorized}
        '403': {description: Warehouse denied}
  /bootstrap:
    get:
      operationId: bootstrap
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/CorrelationId'}
        - {$ref: '#/components/parameters/DeviceId'}
        - {$ref: '#/components/parameters/WarehouseId'}
      responses:
        '200': {description: Trusted operator/device/warehouse context}
        '401': {description: Unauthorized}
        '403': {description: Warehouse denied}
  /dashboard:
    get:
      operationId: dashboard
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/DeviceId'}, {$ref: '#/components/parameters/WarehouseId'}]
      responses:
        '200': {description: Operator dashboard counts}
  /tasks/summary:
    get:
      operationId: taskSummary
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/DeviceId'}
        - {$ref: '#/components/parameters/WarehouseId'}
        - {name: status, in: query, schema: {type: string}}
      responses:
        '200': {description: Counts grouped by category and status}
  /tasks:
    get:
      operationId: listTasks
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/DeviceId'}
        - {$ref: '#/components/parameters/WarehouseId'}
        - {name: category, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {type: string}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: q, in: query, schema: {type: string}}
        - {name: priorityMin, in: query, schema: {type: integer, minimum: 0, maximum: 100}}
        - {name: priorityMax, in: query, schema: {type: integer, minimum: 0, maximum: 100}}
        - {name: zone, in: query, schema: {type: string}}
        - {name: dateFrom, in: query, schema: {type: string, format: date-time}}
        - {name: dateTo, in: query, schema: {type: string, format: date-time}}
        - {name: sort, in: query, schema: {type: string, enum: [priority, dueAt, updatedAt, id]}}
        - {name: direction, in: query, schema: {type: string, enum: [asc, desc], default: asc}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100}}
      responses:
        '200': {description: Cursor-paginated task page}
  /tasks/{taskId}/claim:
    post:
      operationId: claimTask
      security: [{bearerAuth: []}]
      parameters:
        - {name: taskId, in: path, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/DeviceId'}
        - {$ref: '#/components/parameters/WarehouseId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/IfMatch'}
      responses:
        '200': {description: Task claimed or prior idempotent result}
        '409': {description: Task locked or version conflict}
  /tasks/{taskId}/release:
    post:
      operationId: releaseTask
      security: [{bearerAuth: []}]
      parameters:
        - {name: taskId, in: path, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/DeviceId'}
        - {$ref: '#/components/parameters/WarehouseId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/IfMatch'}
      responses:
        '200': {description: Task released or prior idempotent result}
        '409': {description: Version conflict}
  /receiving/tasks:
    get:
      operationId: listReceivingTasks
      security: [{bearerAuth: []}]
      responses: {'200': {description: Cursor-paginated receiving tasks}}
  /receiving/tasks/{taskId}:
    get:
      operationId: receivingDetail
      security: [{bearerAuth: []}]
      parameters: [{name: taskId, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Receiving task and lines}}
  /receiving/tasks/{taskId}/claim:
    post:
      operationId: claimReceivingTask
      security: [{bearerAuth: []}]
      parameters: [{name: taskId, in: path, required: true, schema: {type: string}}, {$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/IfMatch'}]
      responses: {'200': {description: Receipt assignment claimed}, '409': {description: Already claimed or version conflict}}
  /receiving/tasks/{taskId}/start:
    post:
      operationId: startReceivingTask
      security: [{bearerAuth: []}]
      parameters: [{name: taskId, in: path, required: true, schema: {type: string}}, {$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/IfMatch'}]
      responses: {'200': {description: Task started}, '409': {description: Version conflict}}
  /receiving/tasks/{taskId}/barcode-resolutions:
    post:
      operationId: resolveReceivingBarcode
      security: [{bearerAuth: []}]
      parameters: [{name: taskId, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Line resolved}, '422': {description: Unknown or wrong-context barcode}}
  /receiving/tasks/{taskId}/receipts:
    post:
      operationId: confirmReceivingQuantity
      security: [{bearerAuth: []}]
      parameters: [{name: taskId, in: path, required: true, schema: {type: string}}, {$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConfirmReceiptRequest'}
      responses: {'200': {description: Quantity committed or replayed}, '409': {description: Version conflict}, '422': {description: Quantity policy violation}}
  /receiving/tasks/{taskId}/completion:
    post:
      operationId: completeReceivingTask
      security: [{bearerAuth: []}]
      parameters: [{name: taskId, in: path, required: true, schema: {type: string}}, {$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/IfMatch'}]
      responses: {'200': {description: Receiving completed}, '422': {description: Task incomplete}}
  /receiving/commands/{commandId}:
    get:
      operationId: receivingCommandStatus
      security: [{bearerAuth: []}]
      parameters: [{name: commandId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'200': {description: Durable command result}, '404': {description: Command not found}}
  /putaway/tasks:
    get: {operationId: listPutawayTasks, security: [{bearerAuth: []}], responses: {'200': {description: Putaway tasks}}}
  /putaway/tasks/{taskId}:
    get: {operationId: putawayDetail, security: [{bearerAuth: []}], parameters: [{name: taskId, in: path, required: true, schema: {type: string}}], responses: {'200': {description: Putaway task}}}
  /putaway/tasks/{taskId}/source-validations:
    post: {$ref: '#/components/x-movementValidation'}
  /putaway/tasks/{taskId}/destination-suggestions:
    get: {operationId: putawayDestinationSuggestions, security: [{bearerAuth: []}], parameters: [{name: taskId, in: path, required: true, schema: {type: string}}], responses: {'200': {description: Compatible destinations with capacity}}}
  /putaway/tasks/{taskId}/destination-validations:
    post: {$ref: '#/components/x-movementValidation'}
  /putaway/tasks/{taskId}/confirmation:
    post: {$ref: '#/components/x-movementConfirmation'}
  /picking/tasks:
    get: {operationId: listPickingTasks, security: [{bearerAuth: []}], responses: {'200': {description: Picking tasks}}}
  /picking/tasks/{taskId}:
    get: {operationId: pickingDetail, security: [{bearerAuth: []}], parameters: [{name: taskId, in: path, required: true, schema: {type: string}}], responses: {'200': {description: Picking task and current line}}}
  /picking/tasks/{taskId}/claim:
    post:
      operationId: claimPickingTask
      security: [{bearerAuth: []}]
      parameters:
        - {name: taskId, in: path, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/DeviceId'}
        - {$ref: '#/components/parameters/WarehouseId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/IfMatch'}
      responses:
        '200': {description: Picking task claimed or prior idempotent result}
        '409': {description: Task assignment or version conflict}
  /picking/tasks/{taskId}/location-validations:
    post: {$ref: '#/components/x-movementValidation'}
  /picking/tasks/{taskId}/barcode-resolutions:
    post: {$ref: '#/components/x-movementValidation'}
  /picking/tasks/{taskId}/picks:
    post: {$ref: '#/components/x-movementConfirmation'}
  /picking/tasks/{taskId}/completion:
    post: {$ref: '#/components/x-movementCommand'}
  /replenishment/tasks:
    get: {operationId: listReplenishmentTasks, security: [{bearerAuth: []}], responses: {'200': {description: Replenishment tasks}}}
  /replenishment/tasks/{taskId}:
    get: {operationId: replenishmentDetail, security: [{bearerAuth: []}], parameters: [{name: taskId, in: path, required: true, schema: {type: string}}], responses: {'200': {description: Replenishment task}}}
  /replenishment/tasks/{taskId}/source-validations:
    post: {$ref: '#/components/x-movementValidation'}
  /replenishment/tasks/{taskId}/destination-validations:
    post: {$ref: '#/components/x-movementValidation'}
  /replenishment/tasks/{taskId}/item-validations:
    post: {$ref: '#/components/x-movementValidation'}
  /replenishment/tasks/{taskId}/confirmation:
    post: {$ref: '#/components/x-movementConfirmation'}
  /inventory/search:
    get: {security: [{bearerAuth: []}], parameters: [{name: q, in: query, schema: {type: string}}, {name: barcode, in: query, schema: {type: string}}, {name: itemId, in: query, schema: {type: string}}, {name: locationCode, in: query, schema: {type: string}}, {name: lotNumber, in: query, schema: {type: string}}, {name: serialNumber, in: query, schema: {type: string}}, {name: lpnId, in: query, schema: {type: string}}, {name: cursor, in: query, schema: {type: string}}, {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100}}], responses: {'200': {description: Authoritative item and bin search with asOf and stale metadata}}}
  /inventory/items:
    get: {$ref: '#/paths/~1inventory~1search/get'}
  /inventory/balances:
    get: {security: [{bearerAuth: []}], parameters: [{name: itemId, in: query, schema: {type: string}}, {name: locationId, in: query, schema: {type: string}}, {name: locationCode, in: query, schema: {type: string}}, {name: lotNumber, in: query, schema: {type: string}}, {name: serialNumber, in: query, schema: {type: string}}, {name: lpnId, in: query, schema: {type: string}}, {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100}}], responses: {'200': {description: Authoritative balances with asOf and stale metadata}}}
  /inventory/movements:
    get: {security: [{bearerAuth: []}], parameters: [{name: itemId, in: query, schema: {type: string}}, {name: cursor, in: query, schema: {type: string}}], responses: {'200': {description: Movement ledger history}}}
  /inventory/transfers/source-validations:
    post: {$ref: '#/components/x-transferValidation'}
  /inventory/transfers/destination-validations:
    post: {$ref: '#/components/x-transferValidation'}
  /inventory/transfers/item-resolutions:
    post: {$ref: '#/components/x-transferValidation'}
  /inventory/transfers:
    post: {$ref: '#/components/x-transferCommand'}
  /transfers/validate:
    post: {$ref: '#/components/x-transferValidation'}
  /transfers/confirm:
    post: {$ref: '#/components/x-transferCommand'}
  /transfers/commands/{commandId}:
    get:
      security: [{bearerAuth: []}]
      parameters: [{name: commandId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'200': {description: Durable transfer command result}, '404': {description: Command not found}}
  /cycle-count/tasks:
    get: {security: [{bearerAuth: []}], responses: {'200': {description: Cycle count tasks}}}
  /cycle-count/tasks/{taskId}:
    get: {security: [{bearerAuth: []}], parameters: [{name: taskId, in: path, required: true, schema: {type: string}}], responses: {'200': {description: Count task and lines}}}
  /cycle-count/tasks/{taskId}/counts:
    post: {$ref: '#/components/x-countCommand'}
  /cycle-count/tasks/{taskId}/recounts:
    post: {$ref: '#/components/x-countCommand'}
  /cycle-count/tasks/{taskId}/completion:
    post: {$ref: '#/components/x-movementCommand'}
  /counts:
    get: {security: [{bearerAuth: []}], responses: {'200': {description: Cycle count tasks with freshness}}}
  /counts/{taskId}:
    get: {security: [{bearerAuth: []}], parameters: [{name: taskId, in: path, required: true, schema: {type: string}}], responses: {'200': {description: Cycle count task and variance state}}}
  /counts/{taskId}/validate-location:
    post: {$ref: '#/components/x-countValidation'}
  /counts/{taskId}/validate-item:
    post: {$ref: '#/components/x-countValidation'}
  /counts/{taskId}/lines/{lineId}/submit:
    post: {$ref: '#/components/x-countCommand'}
  /counts/{taskId}/recount:
    post: {$ref: '#/components/x-countCommand'}
  /counts/{taskId}/complete:
    post: {$ref: '#/components/x-movementCommand'}
  /counts/commands/{commandId}:
    get:
      security: [{bearerAuth: []}]
      parameters: [{name: commandId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'200': {description: Durable count command result}, '404': {description: Command not found}}
  /shipments/{shipmentId}:
    get: {security: [{bearerAuth: []}], parameters: [{name: shipmentId, in: path, required: true, schema: {type: string}}], responses: {'200': {description: Shipment package carrier tracking and version summary}}}
  /shipments/{shipmentId}/readiness:
    get: {security: [{bearerAuth: []}], parameters: [{name: shipmentId, in: path, required: true, schema: {type: string}}], responses: {'200': {description: Authoritative cross-domain readiness}}}
  /shipments/{shipmentId}/confirmation:
    post:
      security: [{bearerAuth: []}]
      parameters: [{name: shipmentId, in: path, required: true, schema: {type: string}}, {$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ShipmentConfirmationRequest'}}}}
      responses: {'200': {description: Shipment confirmed or replayed}, '409': {description: Stale version}, '422': {description: Readiness carrier tracking or package invalid}}
  /shipments/{shipmentId}/packages/{packageId}/verify:
    post:
      security: [{bearerAuth: []}]
      parameters: [{name: shipmentId, in: path, required: true, schema: {type: string}}, {name: packageId, in: path, required: true, schema: {type: string}}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PackageVerifyRequest'}}}}
      responses: {'200': {description: Package verified and readiness recalculated}, '409': {description: Stale version}, '422': {description: Unknown or wrong-context package}}
  /shipments/{shipmentId}/confirm:
    post:
      security: [{bearerAuth: []}]
      parameters: [{name: shipmentId, in: path, required: true, schema: {type: string}}, {$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ShipmentConfirmRequest'}}}}
      responses: {'200': {description: Shipment confirmed or replayed}, '409': {description: Stale version}, '422': {description: Readiness or carrier/tracking validation}}
  /shipments/{shipmentId}/commands/{commandId}:
    get: {security: [{bearerAuth: []}], parameters: [{name: shipmentId, in: path, required: true, schema: {type: string}}, {name: commandId, in: path, required: true, schema: {type: string, format: uuid}}], responses: {'200': {description: Durable shipping command result}}}
components:
  x-transferValidation:
    security: [{bearerAuth: []}]
    requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TransferRequest'}}}}
    responses: {'200': {description: Transfer step valid}, '422': {description: Location item or stock invalid}}
  x-transferCommand:
    security: [{bearerAuth: []}]
    parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
    requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TransferRequest'}}}}
    responses: {'200': {description: Transfer committed or replayed}, '422': {description: Transfer rejected}}
  x-countCommand:
    security: [{bearerAuth: []}]
    parameters: [{name: taskId, in: path, required: true, schema: {type: string}}, {$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/IfMatch'}]
    requestBody: {required: false, content: {application/json: {schema: {$ref: '#/components/schemas/CountSubmitRequest'}}}}
    responses: {'200': {description: Count command committed or replayed}, '409': {description: Version conflict}, '422': {description: Variance review required}}
  x-countValidation:
    security: [{bearerAuth: []}]
    parameters: [{name: taskId, in: path, required: true, schema: {type: string}}]
    requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CountValidationRequest'}}}}
    responses: {'200': {description: Count validation accepted}, '422': {description: Invalid location or item}}
  x-movementCommand:
    security: [{bearerAuth: []}]
    parameters: [{name: taskId, in: path, required: true, schema: {type: string}}, {$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/IfMatch'}]
    responses: {'200': {description: Movement command committed or replayed}, '409': {description: Version conflict}, '422': {description: Workflow validation failed}}
  x-movementValidation:
    security: [{bearerAuth: []}]
    parameters: [{name: taskId, in: path, required: true, schema: {type: string}}, {$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/IfMatch'}]
    requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MovementValidationRequest'}}}}
    responses: {'200': {description: Validation accepted or replayed}, '409': {description: Version conflict}, '422': {description: Invalid source destination or item}}
  x-movementConfirmation:
    security: [{bearerAuth: []}]
    parameters: [{name: taskId, in: path, required: true, schema: {type: string}}, {$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/IfMatch'}]
    requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MovementQuantityRequest'}}}}
    responses: {'200': {description: Inventory moved or prior result replayed}, '409': {description: Version conflict}, '422': {description: Stock capacity or quantity violation}}
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema: {type: string, format: uuid}
    DeviceId:
      name: X-Device-Id
      in: header
      required: true
      schema: {type: string, minLength: 1}
    WarehouseId:
      name: X-Warehouse-Id
      in: header
      required: true
      schema: {type: string, minLength: 1}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, format: uuid}
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: {type: string}
    OperatorId:
      name: X-Operator-Id
      in: header
      required: false
      description: Non-authoritative operator verification context; server identity comes from the bearer token.
      schema: {type: string, minLength: 1}
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      schema: {type: string, enum: [vi-VN, en-US], default: en-US}
  schemas:
    Envelope:
      type: object
      required: [data, meta, errors]
      properties:
        data: {nullable: true}
        meta: {$ref: '#/components/schemas/Meta'}
        errors:
          type: array
          items: {$ref: '#/components/schemas/APIError'}
    Meta:
      type: object
      required: [serverTime, correlationId]
      properties:
        serverTime: {type: string, format: date-time}
        correlationId: {type: string, format: uuid}
        version: {nullable: true}
        nextCursor: {type: string, nullable: true}
        hasMore: {type: boolean}
        asOf: {type: string, format: date-time, nullable: true}
        stale: {type: boolean}
    APIError:
      type: object
      required: [code, retryable]
      properties:
        code: {type: string}
        message: {type: string}
        details: {type: object, additionalProperties: true, nullable: true}
        retryable: {type: boolean}
    ConflictDetails:
      type: object
      properties:
        aggregateId: {type: string}
        currentVersion: {type: integer, format: int64}
        requestedVersion: {type: integer, format: int64}
    CommandStatus:
      type: object
      required: [commandId, status]
      properties:
        commandId: {type: string, format: uuid}
        idempotencyKey: {type: string, format: uuid}
        type: {type: string}
        status: {type: string, enum: [PENDING, ACKNOWLEDGED, CONFLICT, PERMANENT_FAILURE]}
        aggregateId: {type: string, nullable: true}
        version: {type: integer, format: int64, nullable: true}
        result: {nullable: true}
        errorCode: {type: string, nullable: true}
        correlationId: {type: string, format: uuid}
        processedAt: {type: string, format: date-time, nullable: true}
    ShipmentConfirmationRequest:
      type: object
      required: [carrier, trackingNumber]
      additionalProperties: false
      properties:
        carrier: {type: string}
        trackingNumber: {type: string, minLength: 6, maxLength: 40}
    PackageVerifyRequest:
      type: object
      required: [shipmentId, packageId, rawValue, normalizedValue, symbology, scanContext, baseVersion]
      additionalProperties: false
      properties:
        shipmentId: {type: string}
        packageId: {type: string}
        rawValue: {type: string}
        normalizedValue: {type: string}
        symbology: {type: string}
        scanContext: {type: string, enum: [SHIPPING_PACKAGE]}
        baseVersion: {type: integer, format: int64}
    ShipmentConfirmRequest:
      type: object
      required: [commandId, idempotencyKey, shipmentId, carrierCode, trackingNumber, verifiedPackageIds, baseVersion]
      additionalProperties: false
      properties:
        commandId: {type: string, format: uuid}
        idempotencyKey: {type: string, format: uuid}
        shipmentId: {type: string}
        carrierCode: {type: string, enum: [DHL, FEDEX, UPS, VNPOST]}
        trackingNumber: {type: string, minLength: 6, maxLength: 40}
        verifiedPackageIds: {type: array, items: {type: string}}
        baseVersion: {type: integer, format: int64}
    TransferRequest:
      type: object
      required: [sourceLocation, destinationLocation, itemId, quantity]
      additionalProperties: false
      properties:
        sourceLocation: {type: string}
        destinationLocation: {type: string}
        itemId: {type: string}
        quantity: {type: integer, minimum: 1}
        lotNumber: {type: string, nullable: true}
        serialNumber: {type: string, nullable: true}
        scanContext: {type: string}
        baseVersion: {type: integer, format: int64}
        commandId: {type: string, format: uuid}
        idempotencyKey: {type: string, format: uuid}
