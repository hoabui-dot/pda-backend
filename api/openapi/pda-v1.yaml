      type: object
      required: [category, status, count]
      properties:
        category: {type: string}
        status: {type: string}
        count: {type: integer}
    ConfirmReceiptRequest:
      type: object
      required: [commandId, lineId, barcode, quantity, condition, baseVersion, scannedAt]
      additionalProperties: false
      properties:
        commandId: {type: string, format: uuid}
        idempotencyKey: {type: string, format: uuid}
        taskId: {type: string}
        lineId: {type: string}
        barcode: {type: string}
        quantity: {type: integer, format: int64, minimum: 1}
        condition: {type: string, enum: [GOOD, DAMAGED, QUARANTINED, UNKNOWN]}
        remark: {type: string, nullable: true, maxLength: 500}
        baseVersion: {type: integer, format: int64}
        scannedAt: {type: string, format: date-time}
    ReceivingBarcodeResolveRequest:
      type: object
      required: [rawValue, normalizedValue, symbology, scanContext, scannedAt]
      additionalProperties: false
      properties:
        taskId: {type: string}
        lineId: {type: string, nullable: true}
        rawValue: {type: string, minLength: 1}
        normalizedValue: {type: string, minLength: 1}
        symbology: {type: string, minLength: 1}
        scanContext: {type: string, enum: [RECEIVING_ITEM]}
        operatorId: {type: string}
        warehouseId: {type: string}
        deviceId: {type: string}
        scannedAt: {type: string, format: date-time}
  responses:
    SuccessEnvelope:
      description: Successful PDA API response
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Envelope'}
    ErrorEnvelope:
      description: PDA API error response
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Envelope'}
    RateLimited:
      description: Request rate limit exceeded
      headers:
        Retry-After:
          description: Minimum number of seconds before retrying the request
          schema: {type: integer, format: int32, minimum: 1}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Envelope'}
