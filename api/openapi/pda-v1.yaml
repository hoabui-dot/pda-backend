        inProgress: {type: integer}
        completed: {type: integer}
        highPriority: {type: integer}
        updatedAt: {type: string, format: date-time}
    Task:
      type: object
      required: [id, category, type, status, priority, title, lineCount, pieceCount, assignedOperatorId, lockState, warehouseId, version, createdAt, updatedAt]
      properties:
        id: {type: string}
        category: {type: string, enum: [RECEIVING, PUTAWAY, PICKING, REPLENISHMENT, CYCLE_COUNT]}
        type: {type: string}
