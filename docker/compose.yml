name: pda-backend
services:
  postgres:
    image: postgres:17.5-alpine
    environment:
      POSTGRES_DB: pda
      POSTGRES_USER: pda
      POSTGRES_PASSWORD: local-only-pda
    ports: ["${PDA_POSTGRES_PORT:-15432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pda -d pda"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:8.0.2-alpine
    ports: ["${PDA_REDIS_PORT:-16379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

# Kafka is provided by the shared MES platform. PDA must not start a second
# broker or bind the shared host port independently.

networks:
  platform:
    external: true
    name: ${PDA_PLATFORM_NETWORK_NAME:-platform-net}
