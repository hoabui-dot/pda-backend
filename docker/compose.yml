name: pda-backend
services:
  postgres:
    image: postgres:17.5-alpine
    environment:
      POSTGRES_DB: pda
      POSTGRES_USER: pda
      POSTGRES_PASSWORD: local-only-pda
    ports: ["${PDA_POSTGRES_PORT:-15432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pda -d pda"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:8.0.2-alpine
    ports: ["${PDA_REDIS_PORT:-16379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  kafka:
    image: redpandadata/redpanda:v24.3.9
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --check=false
      - --node-id=0
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://kafka:9092,external://localhost:19092
    ports: ["${PDA_KAFKA_PORT:-19092}:19092"]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health --api-urls localhost:9644 | grep -q Healthy"]
      interval: 5s
      timeout: 5s
      retries: 20
